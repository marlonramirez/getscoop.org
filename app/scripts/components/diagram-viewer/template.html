<dialog class="diagram-viewer m-auto p-0 rounded-lg bg-surface text-on-surface" aria-labelledby="diagram-viewer-title">
  <div class="diagram-toolbar flex flex-wrap shrink-0 items-center gap-sm px-md">
    <h2 id="diagram-viewer-title" class="flex-1 min-w-0 m-0"></h2>
    <button type="button" data-diagram-action="reduce" aria-label="Reducir diagrama" title="Reducir diagrama"><span class="app-icon icon-zoom-out inline-block shrink-0" aria-hidden="true"></span></button>
    <button type="button" data-diagram-action="enlarge" aria-label="Ampliar diagrama" title="Ampliar diagrama"><span class="app-icon icon-zoom-in inline-block shrink-0" aria-hidden="true"></span></button>
  </div>
  <div class="diagram-canvas flex-1 min-h-0 p-md overflow-auto"></div>
  <div class="diagram-footer flex flex-wrap shrink-0 items-center gap-sm px-md justify-end">
    <button type="button" data-diagram-action="reset">Restablecer</button>
    <button type="button" data-diagram-action="close">Cerrar diagrama</button>
  </div>
</dialog>
